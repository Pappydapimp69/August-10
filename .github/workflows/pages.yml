# An EXPLICIT Pages workflow, not the zero-config "dynamic" branch-source
# builder. Recorded reasons, from canon:
#
#   the-game-prologue#E11 — prefer an inspectable CI workflow with the test
#     suite as its first gate; the auto builder's failure mode is a silent
#     queue-with-no-jobs that reports success while deploying nothing.
#   dbh#E6 — if a dynamic branch-source run hangs queued with no jobs, an
#     explicit workflow plus a check of the `github-pages` environment policy
#     is the fix, not waiting.
#   opticon#E3 — Pages via Actions deploys only from the DEFAULT branch. It
#     blocks at deploy setup, not at authoring, which is why `build` runs on
#     any branch and only `deploy` is gated on the default one.
#   opticon#E8 — a green deploy does not mean the URL serves yet; verify with
#     a cache-buster and treat an immediate 404 as propagation, not config.

name: Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # the gate: a deploy that ships a broken tool is worse than no deploy
      - name: Tests
        run: python3 -m unittest discover -s tests -t . -v

      # The canon lives in a PRIVATE repo, so a public runner cannot reach it —
      # the committed docs/index.html is the real render, produced by a linked
      # machine and checked in. The runner must not clobber it.
      #
      # This ordering was a bug once: an unconditional rebuild fell through to
      # the fixture and published a 7-lesson toy over the real 573-lesson page,
      # green the whole way. A fallback that silently downgrades the artifact is
      # worse than one that fails, so the committed page now wins and the
      # fixture is only ever a last resort.
      - name: Build page
        run: |
          if [ -d "$HOME/.brain/memory/projects" ]; then
            echo "::notice::canon reachable — regenerating from ~/.brain"
            python3 -m gossip.cli viz --canon "$HOME/.brain/memory" --out docs/index.html
          elif [ -s docs/index.html ]; then
            echo "::notice::no canon on the runner — deploying the committed page"
          else
            echo "::warning::no canon and no committed page — rendering the fixture"
            python3 -m gossip.cli viz --canon tests/fixtures/canon --out docs/index.html
          fi
          test -s docs/index.html

      # guard the failure above: whatever we are about to deploy must not be the
      # fixture render sitting where the real page belongs
      - name: Refuse to deploy a downgraded page
        run: |
          NODES=$(grep -o '<circle' docs/index.html | wc -l)
          echo "page has ${NODES} nodes"
          if [ "$NODES" -lt 20 ] && [ -s tests/fixtures/canon/projects/local__alpha.md ]; then
            echo "::error::docs/index.html looks like the fixture render (${NODES} nodes)"
            exit 1
          fi

      - uses: actions/configure-pages@v5
        if: github.ref_name == github.event.repository.default_branch
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: docs

  deploy:
    # Pages deploys only from the default branch (opticon#E3)
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # a reported-success deploy is not a serving URL (opticon#E8)
      - name: Verify the served URL
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${URL}?cb=${GITHUB_SHA}-${attempt}")
            echo "attempt ${attempt}: HTTP ${CODE}"
            [ "$CODE" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::${URL} still not serving after 5 attempts"
          exit 1
